name: Moxi checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Install locked environment
        run: pixi install --locked
      - name: Run core and native validation
        run: pixi run check
      - name: Run repeated quick benchmark smoke
        env:
          MOXI_BENCHMARK_RUNS: "3"
        run: pixi run benchmark-quick
      - name: Upload quick benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-quick-${{ github.run_id }}
          path: dist/benchmark-results/quick.json
          if-no-files-found: error
      - name: Upload native screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-screenshot-${{ github.run_id }}
          path: dist/native-artifacts
          if-no-files-found: warn

  package-consumer:
    runs-on: macos-14
    needs: validate
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Install locked environment
        run: pixi install --locked
      - name: Build and consume the package
        run: pixi run package-consumer
