name: Moxi checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Install locked environment
        run: pixi install --locked
      - name: Run core and native validation
        run: pixi run check

  package-consumer:
    runs-on: macos-14
    needs: validate
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Install locked environment
        run: pixi install --locked
      - name: Build and consume the package
        run: pixi run package-consumer
