name: Moxi checks

on:
  push:
  pull_request:

jobs:
  headless-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Install locked environment
        run: pixi install --locked
      - name: Run portable headless package lane
        run: pixi run headless-check

  validate:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Install locked environment
        run: pixi install --locked
      - name: Run core and native validation
        run: pixi run check
      - name: Run repeated quick benchmark smoke
        env:
          MOXI_BENCHMARK_RUNS: "3"
        run: pixi run benchmark-quick
      - name: Check host-independent benchmark contract
        run: pixi run benchmark-contract-check -- --candidate dist/benchmark-results/quick.json
      - name: Upload quick benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-quick-${{ github.run_id }}
          path: dist/benchmark-results/quick.json
          if-no-files-found: error
      - name: Upload native screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-screenshot-${{ github.run_id }}
          path: dist/native-artifacts
          if-no-files-found: warn

  package-consumer:
    runs-on: macos-15
    needs: validate
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Install locked environment
        run: pixi install --locked
      - name: Build and consume Mojo packages and native layout services
        run: pixi run layout-package-consumer

  retained-layout-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Check portable Mojo layout policies
        run: |
          pixi install --locked
          pixi run retained-engine-test
          pixi run mojo run -I src tests/collection_layout.mojo
          pixi run mojo run -I src tests/overlay_layout.mojo

  native-layout-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Linux native development libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential pkg-config libgtk-4-dev fonts-dejavu-core fonts-noto-cjk \
            xvfb xauth xdotool openbox dbus-x11 x11-utils
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.81.0
          cache: true
      - name: Install locked environment
        run: pixi install --locked
      - name: Check native Linux paragraphs and layout, then compile the workbench
        env:
          CC: gcc
          CXX: g++
        run: pixi run --locked linux-layout-check
      - name: Exercise the compiled GTK workbench through X11
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" \
            dbus-run-session -- bash -c '
              openbox > /tmp/moxi-openbox.log 2>&1 &
              moxi_wm_pid=$!
              trap "kill $moxi_wm_pid" EXIT
              moxi_wm_ready=0
              for moxi_wm_attempt in {1..100}; do
                if ! kill -0 "$moxi_wm_pid" 2>/dev/null; then
                  echo "Openbox exited before X11 window activation was ready" >&2
                  cat /tmp/moxi-openbox.log >&2
                  exit 1
                fi
                if xprop -root _NET_SUPPORTED 2>/dev/null | grep -qw _NET_ACTIVE_WINDOW; then
                  moxi_wm_ready=1
                  break
                fi
                sleep 0.1
              done
              if [ "$moxi_wm_ready" -ne 1 ]; then
                echo "Openbox did not advertise _NET_ACTIVE_WINDOW within 10 seconds" >&2
                xprop -root _NET_SUPPORTED _NET_SUPPORTING_WM_CHECK >&2 || true
                cat /tmp/moxi-openbox.log >&2
                exit 1
              fi
              pixi run --locked linux-ui-smoke
            '
      - name: Upload Linux native interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-${{ github.run_id }}
          path: dist/linux-native-artifacts
          if-no-files-found: warn

  layout-candidate-macos:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Check mixed layout and independent precompiled consumer
        run: |
          pixi install --locked
          pixi run layout-candidate-check
