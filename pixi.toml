[workspace]
authors = ["David Mashburn <david.n.mashburn@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "moxi"
platforms = ["osx-arm64", "linux-64"]
preview = ["pixi-build"]
version = "0.6.0"

[tasks]
build = "mojo precompile src/moxi -o dist/moxi.mojoc"
native-object = "clang -O3 -Wall -Wextra -Werror -fobjc-arc -fmodules -c native/macos_window.m -o native/macos_window.o"
metal-object = "clang -O3 -Wall -Wextra -Werror -fobjc-arc -fmodules -c native/macos_metal.m -o native/macos_metal.o"
text-object = "clang -O3 -Wall -Wextra -Werror -fobjc-arc -fmodules -c native/macos_text.m -o native/macos_text.o"
native-text-parity-build = { cmd = "mojo build -I src -Xlinker native/macos_text.o -Xlinker -framework -Xlinker CoreText -Xlinker -framework -Xlinker Cocoa tests/native_text_parity.mojo -o dist/moxi-native-text-parity", depends-on = ["text-object"] }
native-text-parity = { cmd = "./dist/moxi-native-text-parity", depends-on = ["native-text-parity-build"] }
native-scene-parity-build = { cmd = "mojo build -I src -Xlinker native/macos_metal.o -Xlinker -framework -Xlinker Metal -Xlinker -framework -Xlinker QuartzCore -Xlinker -framework -Xlinker Cocoa -Xlinker -framework -Xlinker Foundation tests/native_scene_parity.mojo -o dist/moxi-native-scene-parity", depends-on = ["metal-object"] }
native-scene-parity = { cmd = "./dist/moxi-native-scene-parity", depends-on = ["native-scene-parity-build"] }
native-screenshot-check = { cmd = "bash scripts/native_screenshot_check.sh", depends-on = ["native-scene-parity-build"] }
demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa -Xlinker -export_dynamic examples/demo_browser.mojo -o dist/moxi-demo", depends-on = ["native-object"] }
demo = { cmd = "./dist/moxi-demo", depends-on = ["demo-build"] }
live-script-demo-build = { cmd = "mojo build -I src -I examples -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/live_script_demo.mojo -o dist/moxi-live-script-demo", depends-on = ["native-object"] }
live-script-demo = { cmd = "./dist/moxi-live-script-demo", depends-on = ["live-script-demo-build"] }
live-reload-check = "bash scripts/live_reload_check.sh"
hello-window-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/hello_window.mojo -o dist/moxi-hello-window-demo", depends-on = ["native-object"] }
hello-window-demo = { cmd = "./dist/moxi-hello-window-demo", depends-on = ["hello-window-demo-build"] }
counter-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/counter.mojo -o dist/moxi-counter-demo", depends-on = ["native-object"] }
counter-demo = { cmd = "./dist/moxi-counter-demo", depends-on = ["counter-demo-build"] }
component-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/hello_component.mojo -o dist/moxi-component-demo", depends-on = ["native-object"] }
component-demo = { cmd = "./dist/moxi-component-demo", depends-on = ["component-demo-build"] }
capability-bus-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/capability_bus.mojo -o dist/moxi-capability-bus-demo", depends-on = ["native-object"] }
capability-bus-demo = { cmd = "./dist/moxi-capability-bus-demo", depends-on = ["capability-bus-demo-build"] }
form-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/form.mojo -o dist/moxi-form-demo", depends-on = ["native-object"] }
form-demo = { cmd = "./dist/moxi-form-demo", depends-on = ["form-demo-build"] }
row-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/row.mojo -o dist/moxi-row-demo", depends-on = ["native-object"] }
row-demo = { cmd = "./dist/moxi-row-demo", depends-on = ["row-demo-build"] }
alignment-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/alignment.mojo -o dist/moxi-alignment-demo", depends-on = ["native-object"] }
alignment-demo = { cmd = "./dist/moxi-alignment-demo", depends-on = ["alignment-demo-build"] }
nested-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/nested.mojo -o dist/moxi-nested-demo", depends-on = ["native-object"] }
nested-demo = { cmd = "./dist/moxi-nested-demo", depends-on = ["nested-demo-build"] }
wx-style-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/wx_style.mojo -o dist/moxi-wx-style-demo", depends-on = ["native-object"] }
wx-style-demo = { cmd = "./dist/moxi-wx-style-demo", depends-on = ["wx-style-demo-build"] }
wrapped-text-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/wrapped_text.mojo -o dist/moxi-wrapped-text-demo", depends-on = ["native-object"] }
wrapped-text-demo = { cmd = "./dist/moxi-wrapped-text-demo", depends-on = ["wrapped-text-demo-build"] }
composed-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/composed.mojo -o dist/moxi-composed-demo", depends-on = ["native-object"] }
composed-demo = { cmd = "./dist/moxi-composed-demo", depends-on = ["composed-demo-build"] }
interaction-showcase-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa -Xlinker -export_dynamic examples/interaction_showcase.mojo -o dist/moxi-interaction-showcase-demo", depends-on = ["native-object"] }
interaction-showcase-demo = { cmd = "./dist/moxi-interaction-showcase-demo", depends-on = ["interaction-showcase-demo-build"] }
demo-browser-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa -Xlinker -export_dynamic examples/demo_browser.mojo -o dist/moxi-demo-browser", depends-on = ["native-object"] }
demo-browser = { cmd = "./dist/moxi-demo-browser", depends-on = ["demo-browser-build"] }
demo-walkthrough-build = { cmd = "mojo build -I src -I examples -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa -Xlinker -export_dynamic examples/demo_walkthrough.mojo -o dist/moxi-demo-walkthrough", depends-on = ["native-object"] }
demo-walkthrough = { cmd = "./dist/moxi-demo-walkthrough", depends-on = ["demo-walkthrough-build"] }
demo-record = "bash scripts/record_demo.sh"
theme-showcase-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker -framework -Xlinker Cocoa examples/theme_showcase.mojo -o dist/moxi-theme-showcase-demo", depends-on = ["native-object"] }
theme-showcase-demo = { cmd = "./dist/moxi-theme-showcase-demo", depends-on = ["theme-showcase-demo-build"] }
interactive-fractal-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker native/macos_metal.o -Xlinker -framework -Xlinker Cocoa -Xlinker -framework -Xlinker Metal -Xlinker -framework -Xlinker QuartzCore -Xlinker -framework -Xlinker Foundation examples/interactive_fractal.mojo -o dist/moxi-interactive-fractal-demo", depends-on = ["native-object", "metal-object"] }
interactive-fractal-demo = { cmd = "./dist/moxi-interactive-fractal-demo", depends-on = ["interactive-fractal-demo-build"] }
fractal-benchmark-clock = "clang -O3 -Wall -Wextra -Werror -c native/benchmark_clock.c -o native/benchmark_clock.o"
fractal-benchmark-build = { cmd = "mojo build -I src -Xlinker native/macos_window.o -Xlinker native/macos_metal.o -Xlinker native/benchmark_clock.o -Xlinker -framework -Xlinker Cocoa -Xlinker -framework -Xlinker Metal -Xlinker -framework -Xlinker QuartzCore -Xlinker -framework -Xlinker Foundation benchmarks/interactive_fractal.mojo -o dist/moxi-fractal-benchmark", depends-on = ["native-object", "metal-object", "fractal-benchmark-clock"] }
fractal-benchmark = { cmd = "./dist/moxi-fractal-benchmark", depends-on = ["fractal-benchmark-build"] }
demo-catalog-check = "bash scripts/demo_catalog_check.sh"
scenario-check = "bash scripts/scenario_check.sh"
api-status-check = "bash scripts/api_status_check.sh"
visual-check = "bash scripts/visual_check.sh"
animation-demo = "mojo run -I src examples/animation.mojo"
plot-demo = "mojo run -I src examples/plot.mojo"
plot-gallery = "mojo run -I src examples/plot_gallery.mojo"
plot-benchmark = "mojo run -I src benchmarks/plotting.mojo"
plot-analytics-benchmark = "mojo run -I src benchmarks/plotting_analytics.mojo"
plot-large-benchmark = "mojo run -I src benchmarks/plotting_large.mojo"
plot-stress-benchmark = "mojo run -I src benchmarks/plotting_stress.mojo"
interaction-benchmark = "mojo run -I src benchmarks/interaction_foundation.mojo"
canvas-scene = "mojo run -I src examples/canvas_scene.mojo"
canvas-benchmark = "bash scripts/canvas_benchmark.sh"
python-check = "bash scripts/python_check.sh"
python-package-consumer = "bash scripts/python_package_consumer.sh"
python-benchmark = "python3 scripts/python_benchmark.py"
dataviz-parity = "python3 scripts/dataviz_parity.py"
plot-spec-contract = "python3 scripts/plot_spec_contract_check.py"
capability-wave-check = "python3 scripts/capability_wave_check.py"
headless-check = "bash scripts/headless_check.sh"
plot-interaction-benchmark-build = { cmd = "mojo build -I src -Xlinker native/benchmark_clock.o benchmarks/plotting_interaction.mojo -o dist/moxi-plot-interaction-benchmark", depends-on = ["fractal-benchmark-clock"] }
plot-interaction-benchmark = { cmd = "./dist/moxi-plot-interaction-benchmark", depends-on = ["plot-interaction-benchmark-build"] }
plot-svg = "mojo run -I src examples/plot_svg.mojo"
metal-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_metal.o -Xlinker -framework -Xlinker Metal -Xlinker -framework -Xlinker Foundation examples/metal_scene.mojo -o dist/moxi-metal-demo", depends-on = ["metal-object"] }
metal-demo = { cmd = "./dist/moxi-metal-demo", depends-on = ["metal-demo-build"] }
metal-window-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_metal.o -Xlinker -framework -Xlinker Metal -Xlinker -framework -Xlinker QuartzCore -Xlinker -framework -Xlinker Cocoa -Xlinker -framework -Xlinker Foundation examples/metal_window.mojo -o dist/moxi-metal-window-demo", depends-on = ["metal-object"] }
metal-window-demo = { cmd = "./dist/moxi-metal-window-demo", depends-on = ["metal-window-demo-build"] }
metal-benchmark-build = { cmd = "mojo build -I src -Xlinker native/macos_metal.o -Xlinker -framework -Xlinker Metal -Xlinker -framework -Xlinker Foundation benchmarks/metal.mojo -o dist/moxi-metal-benchmark", depends-on = ["metal-object"] }
metal-benchmark = { cmd = "./dist/moxi-metal-benchmark", depends-on = ["metal-benchmark-build"] }
plot-metal-benchmark-build = { cmd = "mojo build -I src -Xlinker native/macos_metal.o -Xlinker -framework -Xlinker Metal -Xlinker -framework -Xlinker Foundation benchmarks/plotting_metal.mojo -o dist/moxi-plot-metal-benchmark", depends-on = ["metal-object"] }
plot-metal-benchmark = { cmd = "./dist/moxi-plot-metal-benchmark", depends-on = ["plot-metal-benchmark-build"] }
text-demo-build = { cmd = "mojo build -I src -Xlinker native/macos_text.o -Xlinker -framework -Xlinker CoreText -Xlinker -framework -Xlinker Cocoa examples/coretext.mojo -o dist/moxi-coretext-demo", depends-on = ["text-object"] }
text-demo = { cmd = "./dist/moxi-coretext-demo", depends-on = ["text-demo-build"] }
text-conformance = "mojo run -I src tests/text_conformance.mojo"
harfbuzz-demo = "bash scripts/harfbuzz_check.sh"
harfbuzz-check = "bash scripts/harfbuzz_check.sh"
benchmark = "bash scripts/benchmark.sh"
benchmark-compare = "python3 scripts/benchmark_compare.py"
benchmark-policy-check = "python3 scripts/benchmark_policy_check.py"
benchmark-contract-check = "python3 scripts/benchmark_contract_check.py"
benchmark-quick = "MOXI_BENCHMARK_PROFILE=quick bash scripts/benchmark.sh"
benchmark-full = "MOXI_BENCHMARK_PROFILE=full bash scripts/benchmark.sh"
package-consumer = "bash scripts/package_consumer.sh"
test = "bash scripts/test.sh"
check = "bash scripts/check.sh"
host-check = "bash scripts/host_check.sh"
browser-check = "bash scripts/browser_check.sh"
ios-build = "bash scripts/ios_build.sh"
android-build = "bash scripts/android_build.sh"
release-check = "bash scripts/release_check.sh"
release-preflight = "bash scripts/public_release_preflight.sh"

[dependencies]
mojo = ">=1.1.0.dev2026082605,<2"
ripgrep = ">=14,<15"
canvas_mojo = { git = "https://github.com/davidmashburn/canvas_mojo.git", rev = "323154f9399f4ecfa6d5d2fb0fc7d87883fe3c1e" }

[package]
name = "moxi"
version = "0.6.0"
publish = true

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/moxi"
name = "moxi"

[package.host-dependencies]
mojo-compiler = "==1.1.0.dev2026082605"
canvas_mojo = { path = "packages/canvas_mojo" }

[package.build-dependencies]
mojo-compiler = "==1.1.0.dev2026082605"
canvas_mojo = { path = "packages/canvas_mojo" }

[package.run-dependencies]
mojo-compiler = "==1.1.0.dev2026082605"
canvas_mojo = { path = "packages/canvas_mojo" }
