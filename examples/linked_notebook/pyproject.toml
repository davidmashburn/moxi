[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moxi-linked-notebook-experiment"
version = "0.1.0"
description = "Experimental P05 linked plot consumer; not a general Moxi adapter"
requires-python = ">=3.11"
dependencies = ["anywidget==0.9.21", "ipywidgets==8.1.8"]

[tool.setuptools]
packages = ["moxi_linked_notebook"]

[tool.setuptools.package-data]
moxi_linked_notebook = ["widget.mjs"]
