[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "moxi"
version = "0.5.1"
description = "Backend-neutral plotting and UI scene contracts for Mojo and Python"
readme = "docs/python.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "David Mashburn" }]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
pandas = ["pandas>=2.0"]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
moxi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
