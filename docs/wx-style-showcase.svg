<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1680" viewBox="0 0 1120 1680" role="img" aria-labelledby="title desc">
  <title id="title">Moxi wxPython-style showcase reference</title>
  <desc id="desc">A dark native UI reference showing a frame, panel, controls, capability status, approval buttons, and embedded counter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101622"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202a3d"/>
      <stop offset="1" stop-color="#182134"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63d5c6"/>
      <stop offset="1" stop-color="#55a7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <style>
      .eyebrow { font: 700 18px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 2px; fill: #7d93b5; }
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, sans-serif; fill: #f3f7ff; }
      .subtitle { font: 400 19px -apple-system, BlinkMacSystemFont, sans-serif; fill: #9eacc4; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, sans-serif; fill: #b5c5df; }
      .body { font: 400 17px -apple-system, BlinkMacSystemFont, sans-serif; fill: #d8e3f4; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, sans-serif; fill: #91a4c4; }
      .button { font: 700 16px -apple-system, BlinkMacSystemFont, sans-serif; fill: #0d1725; }
      .mono { font: 500 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a9c5ed; }
    </style>
  </defs>

  <rect width="1120" height="1680" fill="url(#bg)"/>
  <rect x="32" y="32" width="1056" height="1616" rx="28" fill="url(#panel)" stroke="#334563" stroke-width="2" filter="url(#shadow)"/>

  <text x="82" y="92" class="eyebrow">MOXI / WX-STYLE TEACHING SURFACE</text>
  <text x="82" y="150" class="title">wxPython-style Moxi</text>
  <text x="82" y="184" class="subtitle">Frame → Panel → BoxSizer → controls</text>
  <line x1="82" y1="216" x2="1038" y2="216" stroke="#334563"/>

  <text x="82" y="268" class="label">Your name</text>
  <rect x="82" y="286" width="956" height="64" rx="12" fill="#101824" stroke="#55a7ff" stroke-width="3"/>
  <text x="108" y="326" class="body">Ada Lovelace</text>
  <rect x="108" y="334" width="132" height="3" rx="1.5" fill="#63d5c6"/>

  <text x="82" y="398" class="label">Status</text>
  <text x="82" y="430" class="body">Ready. Type a name.</text>

  <rect x="82" y="468" width="28" height="28" rx="6" fill="#63d5c6"/>
  <path d="M89 482 l7 7 14 -16" fill="none" stroke="#10202a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="490" class="body">Remember this name</text>

  <text x="82" y="558" class="label">Activity</text>
  <rect x="82" y="580" width="956" height="18" rx="9" fill="#0f1724"/>
  <rect x="82" y="580" width="474" height="18" rx="9" fill="url(#accent)"/>
  <text x="82" y="630" class="small">50% complete · determinate progress</text>

  <rect x="82" y="678" width="956" height="282" rx="18" fill="#121b2a" stroke="#2b3b57"/>
  <text x="112" y="724" class="eyebrow">RUNTIME DETAILS</text>
  <text x="112" y="766" class="body">Backend: macOS AppKit</text>
  <text x="112" y="806" class="body">Text layout: AppKit shaping + bidi;</text>
  <text x="112" y="834" class="small">headless uses deterministic metrics.</text>
  <text x="112" y="878" class="body">Capability bus: 4 registered / 1 approved / 0 rejected</text>
  <text x="112" y="918" class="body">Rich text model: Rich text spans (portable flatten fallback)</text>

  <rect x="82" y="992" width="956" height="132" rx="18" fill="#181f33" stroke="#825dd8" stroke-width="2"/>
  <text x="112" y="1034" class="eyebrow">AGENT APPROVAL</text>
  <text x="112" y="1072" class="body">Agent approval: pending — choose Approve reset</text>
  <text x="112" y="1104" class="small">The agent request is blocked until a trusted UI approval is issued.</text>

  <text x="82" y="1180" class="label">Actions</text>
  <rect x="82" y="1202" width="138" height="50" rx="10" fill="#63d5c6"/>
  <text x="127" y="1234" class="button">OK</text>
  <rect x="234" y="1202" width="138" height="50" rx="10" fill="#c2d0e5"/>
  <text x="274" y="1234" class="button">Cancel</text>
  <rect x="386" y="1202" width="138" height="50" rx="10" fill="#ffb56b"/>
  <text x="424" y="1234" class="button">Reset</text>
  <rect x="538" y="1202" width="168" height="50" rx="10" fill="#55a7ff"/>
  <text x="561" y="1234" class="button">Agent reset</text>
  <rect x="720" y="1202" width="194" height="50" rx="10" fill="#63d5c6"/>
  <text x="744" y="1234" class="button">Approve reset</text>

  <rect x="82" y="1304" width="956" height="80" rx="16" fill="#101824" stroke="#2b3b57"/>
  <text x="112" y="1338" class="body">Learn the event flow:</text>
  <text x="300" y="1338" class="mono">click → route → action → authorize → update → rebuild</text>
  <text x="112" y="1366" class="small">The same request envelope can be used by an agent adapter.</text>

  <rect x="82" y="1430" width="956" height="152" rx="18" fill="#121b2a" stroke="#2b3b57"/>
  <text x="112" y="1472" class="eyebrow">TYPED EMBEDDED COMPONENT</text>
  <text x="112" y="1514" class="body">Count: 0</text>
  <rect x="270" y="1480" width="154" height="48" rx="10" fill="#55a7ff"/>
  <text x="295" y="1511" class="button">Increment</text>
  <text x="112" y="1556" class="small">CounterState is owned by a ComponentSlot with namespaced ids.</text>
</svg>
