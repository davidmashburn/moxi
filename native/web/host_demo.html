<!doctype html>
<html lang="en" data-moxi-ready="false">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moxi Web Host</title>
    <style>
      :root { color-scheme: dark; font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e111a; color: #eff3ff; }
      main { width: min(760px, calc(100vw - 32px)); }
      canvas { display: block; width: 100%; height: min(70vh, 520px); border-radius: 18px; outline: 1px solid #3a4b70; outline-offset: -1px; background: #0e111a; }
      canvas:focus { outline: 2px solid #6fd6b4; outline-offset: 2px; }
      p { color: #bfc9de; line-height: 1.5; }
      code { color: #6fd6b4; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="moxi-surface" tabindex="0" aria-label="Moxi Web host demo" data-moxi-surface="moxi-surface"></canvas>
      <p id="status" data-moxi-status="starting">Starting the Moxi Web host…</p>
      <p>Click or touch the surface. The same scalar host contract drives pointer,
        keyboard, IME, resize, animation-frame, and teardown callbacks.</p>
    </main>
    <script type="module">
      import { MoxiWebHost } from "../hosts/moxi_web_host.mjs";

      const canvas = document.querySelector("#moxi-surface");
      const status = document.querySelector("#status");
      const context = canvas.getContext("2d");
      let frames = 0;
      let lastEvent = "ready";

      function publishState() {
        window.__MOXI_HOST_STATE__ = Object.freeze({
          ready: document.documentElement.dataset.moxiReady === "true",
          frames,
          lastEvent,
          width: canvas.width,
          height: canvas.height,
          status: status.textContent,
        });
      }

      function draw() {
        const scale = window.devicePixelRatio || 1;
        const width = canvas.width / scale;
        const height = canvas.height / scale;
        context.setTransform(scale, 0, 0, scale, 0, 0);
        context.clearRect(0, 0, width, height);
        context.fillStyle = "#0e111a";
        context.fillRect(0, 0, width, height);
        const inset = Math.min(60, width * 0.08, height * 0.08);
        const centerX = width / 2;
        const centerY = height / 2;
        context.fillStyle = "#263048";
        context.beginPath();
        context.roundRect(inset, inset, width - 2 * inset, height - 2 * inset, 22);
        context.fill();
        context.fillStyle = "#6fd6b4";
        context.fillRect(centerX - 5, centerY - 40, 10, 10);
        context.textAlign = "center";
        context.fillStyle = "#eff3ff";
        context.font = "600 19px ui-monospace, monospace";
        context.fillText("Moxi Web host", centerX, centerY + 4);
        context.fillStyle = "#bfc9de";
        context.font = "13px ui-monospace, monospace";
        context.fillText(`frame ${frames}`, centerX, centerY + 32);
      }

      const host = new MoxiWebHost(canvas, {
        event(kind, pointerId, x, y) {
          lastEvent = `event ${kind} / pointer ${pointerId} @ ${Math.round(x)},${Math.round(y)}`;
          status.textContent = `Moxi Web host • ${lastEvent}`;
          status.dataset.moxiStatus = "event";
          publishState();
        },
        key(key) {
          lastEvent = `key ${key}`;
          status.textContent = `Moxi Web host • ${lastEvent}`;
          status.dataset.moxiStatus = "key";
          publishState();
        },
        resize(width, height, scale) {
          status.textContent = `Moxi Web host • ${Math.round(width)} × ${Math.round(height)} @ ${scale.toFixed(1)}x • frame ${frames}`;
          draw();
          publishState();
        },
        frame() {
          frames += 1;
          draw();
          publishState();
        },
      });
      host.start();
      document.documentElement.dataset.moxiReady = "true";
      status.dataset.moxiStatus = "ready";
      window.__MOXI_HOST_READY__ = true;
      publishState();
      window.addEventListener("beforeunload", () => host.stop(), { once: true });
      canvas.focus();
    </script>
  </body>
</html>
