[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moxi-math-probe"
version = "0.1.0"
description = "D01 experimental symbolic application boundary for Moxi"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
sympy = ["sympy==1.14.0", "mpmath==1.3.0"]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
include = ["moxi_math_probe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
